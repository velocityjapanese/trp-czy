name: Auto Publish Tropicozy Videos

on:
  schedule:
    # Run 3 times daily
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  publish-tropical-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tropicozy Pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_MUSIC_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_MUSIC_FOLDER_ID }}
          GOOGLE_DRIVE_IMAGES_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_IMAGES_FOLDER_ID }}
          GOOGLE_DRIVE_VIDEOS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_VIDEOS_FOLDER_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python auto_pipeline.py

      - name: Commit published videos log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_videos.json
          if ! git diff --staged --quiet; then
            git commit -m "Update published videos log [skip ci]"
            git push
            echo "✅ Successfully committed published_videos.json"
          else
            echo "ℹ️ No changes in published_videos.json to commit."
          fi
